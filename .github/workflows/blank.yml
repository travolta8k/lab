name: Generate User Subscriptions

on:
  push:
    paths:
      - "servers.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate user subscription files
        run: |
          users=("Abji" "Brother.sh" "D.k.f" "D.k.f33" "D.k.f4" "D.k.f5" "D.karm" "D.Mitra" "D.n.jaf" "Farid" "Foad_m" "Hosein" "Karami" "Mitra+Mahin" "Peyman" "Rahmani" "Sheibani" "mother_sheida")

          for user in "${users[@]}"; do
            cp servers.txt "$user"
          done

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add $(ls | grep -v "servers.txt")
          git commit -m "Auto update user subscriptions" || echo "No changes"
          git push